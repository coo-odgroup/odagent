<div class="change-password-overlay">
  <div class="change-password-modal">
    <!-- ================= SUCCESS SCREEN ================= -->
    <div class="password-success-screen" *ngIf="passwordChangedSuccessfully">
      <div class="success-icon-wrapper">
        <i class="fa fa-check"></i>
      </div>

      <h2>Password Changed Successfully!</h2>

      <p>
        Your password has been updated successfully. You can now continue using
        your account securely.
      </p>

      <div class="password-redirect-section">
        <div class="redirect-timer">
          <i class="fa fa-clock-o"></i>

          Redirecting to login in

          <strong>{{ redirectSeconds }}</strong>

          seconds...
        </div>

        <button
          type="button"
          class="password-success-btn"
          (click)="logout()"
        >
          <i class="fa fa-sign-in"></i>

          Login with New Password
        </button>
      </div>
    </div>

    <!-- ================= PASSWORD FORM ================= -->
    <ng-container *ngIf="!passwordChangedSuccessfully">
      <!-- Header -->
      <div class="change-password-header">
        <div class="change-password-header-left">
          <div>
            <h2>First-Time Password Change</h2>

            <p>Please create a new password to secure your account</p>
          </div>
        </div>
      </div>

      <!-- Body -->
      <div class="change-password-body">
        <div class="change-password-form">
          <!-- New Password -->
          <div class="password-form-group">
            <label>
              New Password
              <span>*</span>
            </label>

            <div class="password-input">
              <i class="fa fa-lock password-left-icon"></i>

              <input
                [type]="showNewPassword ? 'text' : 'password'"
                [(ngModel)]="newPassword"
                placeholder="Enter new password"
                autocomplete="new-password"
              />

              <button
                type="button"
                class="password-eye"
                (click)="showNewPassword = !showNewPassword"
              >
                <i
                  class="fa"
                  [ngClass]="showNewPassword ? 'fa-eye-slash' : 'fa-eye'"
                >
                </i>
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="password-form-group">
            <label>
              Confirm Password
              <span>*</span>
            </label>

            <div
              class="password-input"
              [class.password-error]="
                confirmPassword && newPassword !== confirmPassword
              "
            >
              <i class="fa fa-lock password-left-icon"></i>

              <input
                [type]="showConfirmPassword ? 'text' : 'password'"
                [(ngModel)]="confirmPassword"
                placeholder="Re-enter new password"
                autocomplete="new-password"
              />

              <button
                type="button"
                class="password-eye"
                (click)="showConfirmPassword = !showConfirmPassword"
              >
                <i
                  class="fa"
                  [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"
                >
                </i>
              </button>
            </div>

            <div
              class="password-match-error"
              *ngIf="confirmPassword && newPassword !== confirmPassword"
            >
              <i class="fa fa-exclamation-circle"></i>

              Passwords do not match.
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="change-password-footer">
        <button type="button" class="password-cancel-btn" (click)="logout()">
          Logout
        </button>

        <button
          type="button"
          class="password-submit-btn"
          [disabled]="
            !newPassword || !confirmPassword || newPassword !== confirmPassword
          "
          (click)="changePassword()"
        >
          <i class="fa fa-check"></i>

          Change Password
        </button>
      </div>
    </ng-container>
  </div>
</div>
