<div class="auth-wrapper" style="background-image:url(../../assets/images/agent_bg.png)">

  <div class="overlay"></div>

  <div class="auth-content">

    <img src="assets/images/odbus-logo.svg" alt="ODBUS" class="logo">

    <div class="glass-card">

      <!-- FORGET PASSWORD -->
      <div *ngIf="!OtpData">

        <h3 class="title">Forgot Password</h3>
        <p class="subtitle">
          Enter your registered email address
        </p>

        <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">

          <div class="form-group">

            <input type="email" class="form-control custom-input" formControlName="email" placeholder="Email Address">

            <div *ngIf="submitted && f.email.errors" class="error-text">

              <div *ngIf="f.email.errors.required">
                Email ID is required
              </div>

              <div *ngIf="f.email.errors.email">
                Email must be valid
              </div>

            </div>

          </div>

          <button class="btn btn-primary action-btn" type="submit">

            Send OTP

          </button>

        </form>

      </div>

      <!-- OTP SECTION -->
      <div *ngIf="OtpData && verifyStatus == false">

        <h3 class="title">Verify OTP</h3>

        <p class="otp-text" *ngIf="email_id">
          OTP sent to
          <strong>{{ maskEmail(email_id) }}</strong>
        </p>

        <form [formGroup]="otpForm" (ngSubmit)="onSubmitOtp()">

          <div class="form-group">

            <input type="text" class="form-control custom-input" formControlName="otp" placeholder="Enter OTP">

            <div *ngIf="Otpsubmitted && fo.otp.errors" class="error-text">

              OTP is required

            </div>

          </div>

          <button class="btn btn-primary action-btn" type="submit">

            Verify OTP

          </button>

        </form>

        <div class="otp-footer">

          <span *ngIf="timeLeft > 0">
            Resend OTP in
            <strong>{{timeLeft}}</strong> sec
          </span>

          <button *ngIf="timeLeft === 0" class="btn-link" type="button" (click)="resendOtp()">

            Resend OTP

          </button>

        </div>

      </div>

      <!-- RESET PASSWORD -->
      <div *ngIf="verifyStatus==true">

        <h3 class="title">Reset Password</h3>

        <form [formGroup]="resetForm" (ngSubmit)="onSubmitResetPassword()">

          <div class="form-group">

            <input type="password" class="form-control custom-input" formControlName="password"
              placeholder="New Password">

            <div *ngIf="Resetsubmitted && rf.password.errors" class="error-text">

              Password is required

            </div>

          </div>

          <div class="form-group">

            <input type="password" class="form-control custom-input" formControlName="confirm_password"
              placeholder="Confirm Password">

            <div *ngIf="Resetsubmitted && rf.confirm_password.errors" class="error-text">

              <div *ngIf="rf.confirm_password.errors.required">
                Confirm Password is required
              </div>

              <div *ngIf="rf.confirm_password.errors.mustMatch">
                Passwords do not match
              </div>

            </div>

          </div>

          <button class="btn btn-primary action-btn" type="submit">

            Change Password

          </button>

        </form>

      </div>

    </div>

    <div class="back-home">
      <a routerLink="/dashboard/landing">
        ← Back to Home
      </a>
    </div>

  </div>

</div>
